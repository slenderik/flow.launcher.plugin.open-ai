name: Release

on:
    workflow_dispatch:
    push:
        branches: [master]

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v4
            - name: Set up Node.Js
              uses: actions/setup-node@v4
              with:
                node-version: '17.3.0'
            - name: get version
              id: version
              uses: notiz-dev/github-action-json-property@release
              with:
                  path: "plugin.json"
                  prop_path: "Version"
            - run: echo ${{steps.version.outputs.prop}}
            - name: Install & Package
              run: |
                npm install
                npm run build
                zip -r NPMSearch-${{steps.version.outputs.prop}}.zip . -x '*.git*'
            - name: Publish
              uses: softprops/action-gh-release@v2
              with:
                  files: "NPMSearch-${{steps.version.outputs.prop}}.zip"
                  tag_name: "v${{steps.version.outputs.prop}}"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
